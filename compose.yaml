name: acb-dashboard

services:
  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: apps/bff/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: "3001"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      AUTH_BASE_URL: ${AUTH_BASE_URL:?Set AUTH_BASE_URL to the auth service origin}
      ADMIN_USERS_BASE_URL: ${ADMIN_USERS_BASE_URL:-}
      REDIS_URL: redis://redis:6379
      SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET:?Generate a 48-byte base64url secret}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?Generate a 32-byte base64url key}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-8000}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-172.16.0.0/12}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      BFF_INTERNAL_URL: http://bff:3001
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  proxy:
    image: caddy:2.10.2-alpine
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${PROXY_PORT:-8080}:80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
